name: Daily UCalgary BioSci Activity Tracker

on:
  schedule:
    # Runs everyday at 14:00 UTC (8:00 AM Calgary / Mountain Time)
    - cron: '0 14 * * *'
  workflow_dispatch: # Enables manual "Run workflow" button

permissions:
  contents: write

jobs:
  track-activities:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Activity Tracker Script
        run: powershell -ExecutionPolicy Bypass -File ./update_activities.ps1

      - name: Commit and Push Updated activity.md
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add activity.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update activity.md for $(Get-Date -Format 'yyyy-MM-dd')" && git push)
